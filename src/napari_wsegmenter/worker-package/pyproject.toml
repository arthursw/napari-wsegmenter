[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "napari-wsegmenter-worker"
version = "0.1.1"
description = "Isolated segmentation workers for napari-wsegmenter"
requires-python = ">=3.10"
dependencies = ["numpy"]

[tool.setuptools.packages.find]
where = ["src"]
