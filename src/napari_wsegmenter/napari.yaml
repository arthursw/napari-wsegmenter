schema_version: 0.3.0
name: napari-wsegmenter
display_name: WSegmenter
host_dependency_policy: napari
# use 'hidden' to remove plugin from napari hub search results
visibility: public
categories: ["Segmentation"]
contributions:
  environments:
    - id: napari-wsegmenter.cellpose
      display_name: Cellpose
      python: "==3.10.*"
      conda:
        - numpy
        - cellpose==3.1.0
      channels:
        - conda-forge
      local_packages:
        - path: worker
    - id: napari-wsegmenter.stardist
      display_name: StarDist
      python: "==3.10.*"
      pypi:
        - numpy>=1.23.5,<2
        - tensorflow==2.16.1
        - csbdeep==0.8.2
        - stardist==0.9.2
      channels:
        - conda-forge
      local_packages:
        - path: worker
    - id: napari-wsegmenter.sam
      display_name: SAM 2
      python: "==3.10.*"
      pypi:
        - numpy>=1.24.4
        - sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4
        - huggingface-hub==0.29.2
      channels:
        - conda-forge
      local_packages:
        - path: worker
    - id: napari-wsegmenter.threshold_numpy1
      display_name: Threshold NumPy 1.26
      python: "==3.10.*"
      conda:
        - numpy==1.26.4
      channels:
        - conda-forge
      local_packages:
        - path: worker
    - id: napari-wsegmenter.threshold_numpy2
      display_name: Threshold NumPy 2.2
      python: "==3.10.*"
      conda:
        - numpy==2.2.6
      channels:
        - conda-forge
      local_packages:
        - path: worker
  commands:
    - id: napari-wsegmenter.cellpose_worker
      python_name: napari_wsegmenter_worker:segment_cellpose
      title: Segment with Cellpose
      environment: napari-wsegmenter.cellpose
      accepts_worker_context: true
    - id: napari-wsegmenter.stardist_worker
      python_name: napari_wsegmenter_worker:segment_stardist
      title: Segment with StarDist
      environment: napari-wsegmenter.stardist
      accepts_worker_context: true
    - id: napari-wsegmenter.sam_worker
      python_name: napari_wsegmenter_worker:segment_sam
      title: Segment with SAM
      environment: napari-wsegmenter.sam
      accepts_worker_context: true
    - id: napari-wsegmenter.threshold_numpy1_worker
      python_name: napari_wsegmenter_worker:segment_threshold
      title: Threshold with NumPy 1.26
      environment: napari-wsegmenter.threshold_numpy1
      accepts_worker_context: true
    - id: napari-wsegmenter.threshold_numpy2_worker
      python_name: napari_wsegmenter_worker:segment_threshold
      title: Threshold with NumPy 2.2
      environment: napari-wsegmenter.threshold_numpy2
      accepts_worker_context: true
    - id: napari-wsegmenter.make_cellpose_widget
      python_name: napari_wsegmenter:CellposeWidget
      title: Make Cellpose widget
    - id: napari-wsegmenter.make_stardist_widget
      python_name: napari_wsegmenter:StardistWidget
      title: Make StarDist widget
    - id: napari-wsegmenter.make_sam_widget
      python_name: napari_wsegmenter:SamWidget
      title: Make SAM widget
    - id: napari-wsegmenter.make_threshold_widget
      python_name: napari_wsegmenter:ThresholdWidget
      title: Make threshold test widget
  widgets:
    - command: napari-wsegmenter.make_cellpose_widget
      display_name: Cellpose
    - command: napari-wsegmenter.make_stardist_widget
      display_name: StarDist
    - command: napari-wsegmenter.make_sam_widget
      display_name: SAM
    - command: napari-wsegmenter.make_threshold_widget
      display_name: Threshold environment test
  menus:
    napari/layers/segment:
      - command: napari-wsegmenter.make_cellpose_widget
      - command: napari-wsegmenter.make_stardist_widget
      - command: napari-wsegmenter.make_sam_widget
      - command: napari-wsegmenter.make_threshold_widget
